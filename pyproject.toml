[project]
name = "trade"
version = "0.0.1"
description = "Self-improving multi-asset (US equities + crypto) trading research engine"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15",
    "pyyaml>=6",
    "requests>=2.31",
    "ccxt>=4.4",
    "alpaca-py>=0.33",
    "exchange-calendars>=4.5",
]

# NOTE: the heavy research stack (vectorbt, optuna, gplearn, river, hmmlearn,
# arch, ...) is intentionally introduced in later milestones (M1/M2/M4/M5) as a
# separate optional dependency group, to keep the M0 lock/install fast and
# conflict-free. See the implementation plan.

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
trade = "engine.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["engine"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# Line length is handled by the formatter; don't double-flag long strings/URLs.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

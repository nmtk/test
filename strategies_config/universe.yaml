# Instrument universe — the markets the engine syncs, researches, and trades.
#
# Schema
#   timeframes: default bar sizes for every instrument (overridable per instrument)
#   instruments[]:
#     symbol       canonical symbol ("BTC/JPY" crypto / "AAPL" equity / "USD/JPY" fx)
#     asset_class  crypto | equity | fx
#     venue        bitbank | alpaca | oanda   (execution venue; implies the data source)
#     base/quote   optional currency hints (defaults: crypto JPY, equity USD)
#     timeframes   optional per-instrument override of the file-level timeframes
#     data         optional override of the bar source implied by `venue`
#       source     dukascopy | stooq | fred | ...
#       symbol     source-native symbol
#     research     optional deep-history source for R&D (re-validated on the live venue)
#       source     binance | alpaca
#       symbol     source-native symbol ("BTC/USDT")
#
# Start small and liquid; expand once the validation + execution pipeline is proven.

timeframes: ["1h", "4h", "1d"]

instruments:
  # --- Crypto (bitbank live; Binance deep history for research) ----------------------
  - symbol: "BTC/JPY"
    asset_class: crypto
    venue: bitbank
    base: BTC
    quote: JPY
    research: { source: binance, symbol: "BTC/USDT" }

  - symbol: "ETH/JPY"
    asset_class: crypto
    venue: bitbank
    base: ETH
    quote: JPY
    research: { source: binance, symbol: "ETH/USDT" }

  - symbol: "XRP/JPY"
    asset_class: crypto
    venue: bitbank
    base: XRP
    quote: JPY
    research: { source: binance, symbol: "XRP/USDT" }

  # --- US equities / ETFs (Alpaca; free IEX data) -----------------------------------
  - symbol: "SPY"
    asset_class: equity
    venue: alpaca
    quote: USD

  - symbol: "QQQ"
    asset_class: equity
    venue: alpaca
    quote: USD

  - symbol: "AAPL"
    asset_class: equity
    venue: alpaca
    quote: USD

  # --- Spot FX (OANDA execution; Dukascopy free ticks for bars) ----------------------
  #
  # USD/JPY is the asset the `wemof` and `trade_balance` archetypes were written for.
  # See docs/STRATEGY.md: on daily bars the gate needs a ~30,858-bar track record before
  # WEMOF's Sharpe is distinguishable from luck, which is why this carries a 5m timeframe
  # — three years of 5m is ~225,000 bars, the regime where that is satisfiable.
  #
  # `data` overrides the venue's feed on purpose: Dukascopy is keyless, so bars sync and
  # research runs with no broker credentials at all. OANDA is used only to place orders,
  # and `_default_factory` returns no broker when its keys are unset — so an unconfigured
  # deployment researches USD/JPY and trades nothing.
  #
  # 1h and 1d are derived from 5m by resampling (see DERIVE_SOURCES in engine/data/sync.py).
  - symbol: "USD/JPY"
    asset_class: fx
    venue: oanda
    base: USD
    quote: JPY
    timeframes: ["5m", "1h", "1d"]
    size_step: 1.0        # v20 takes integer units of the base currency
    min_size: 1.0
    data: { source: dukascopy, symbol: "USD/JPY" }

# --- Research-only series (never traded) ---------------------------------------------
#
# Deep history for instruments whose *tradeable* feed is shallow. USD/JPY trades on bars
# backfilled from a tick feed — realistically three years — while the same instrument's
# daily history runs to 1971 on FRED. `trade_balance` reads a monthly signal and is simply
# unjudgeable on three years: on 768 bars it scored PBO 0.43 and SPA 0.78 (both failing),
# and on 13,936 bars the same strategy scored PBO 0.02 and SPA 0.01 (both passing).
#
# `fred` is not a venue, so records discovered here are barred from promotion — see
# promote_step. They inform research; they never reach an executor.
research_series:
  - source: fred
    symbol: DEXJPUS
    asset_class: fx
    timeframes: ["1d"]

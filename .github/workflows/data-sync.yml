name: data-sync

# Job A: incrementally fetch OHLCV (crypto + equities) into data/ and commit it.
# Idempotent and delay-tolerant — best-effort cron is fine.

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      research:
        description: "Also sync deep-history research sources"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: data-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync
      - name: Sync OHLCV
        env:
          # bitbank/binance OHLCV is public; Alpaca data needs keys (no-op if unset).
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
        run: |
          if [ "${{ inputs.research }}" = "true" ]; then
            uv run trade sync-data --research
          else
            uv run trade sync-data
          fi
      - name: Commit data
        run: |
          git config user.name "trade-bot"
          git config user.email "trade-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: sync OHLCV [skip ci]"
            for attempt in 1 2 3 4 5; do
              git push && break
              echo "push rejected by a concurrent write; rebasing (attempt $attempt)"
              if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
                git rebase --abort || true
                echo "::error::rebase conflict — refusing to guess, leaving the branch untouched"
                exit 1
              fi
              sleep $((RANDOM % 5 + 2))
            done
          fi

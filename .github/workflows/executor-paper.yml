name: executor-paper

# Job C: paper trading on the same code path as live. Each run first advances the
# promotion/decay FSM (incubating -> champion on forward evidence; champion -> retired on
# decay; rebuild champions.json), then steps the paper broker on the current champions and
# commits state/.

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: executor-paper
  cancel-in-progress: false

jobs:
  step:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync
      - name: Promote (incubation/decay FSM)
        run: uv run trade promote
      - name: Paper step
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
          ALPACA_PAPER: "true"
        run: uv run trade paper-step
      - name: Report
        run: uv run trade report
      - name: Commit state
        run: |
          git config user.name "trade-bot"
          git config user.email "trade-bot@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "no state changes"
          else
            git commit -m "state: paper step [skip ci]"
            for attempt in 1 2 3 4 5; do
              git push && break
              echo "push rejected by a concurrent write; rebasing (attempt $attempt)"
              if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
                git rebase --abort || true
                echo "::error::rebase conflict — refusing to guess, leaving the branch untouched"
                exit 1
              fi
              sleep $((RANDOM % 5 + 2))
            done
          fi

name: research-nightly

# Job D: the only heavy job. Time-boxed and run once per day (never 24/7) to respect
# Actions usage norms. Runs parameter search + GP discovery through the validation gate
# and commits surviving challengers. (research is a stub until M4/M5.)

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # Shared with executor-paper and executor-live: all three run `trade promote` and commit
  # state/, so if two overlap the second one's push is rejected and the rebase hits
  # state/population.db — a binary file no resolution can merge. Queueing makes that
  # impossible. The cost is at most one skipped hourly paper step (a queued run is
  # cancelled when the next one of the same workflow arrives), and the executor derives
  # its current bar from the data's own timestamps rather than the wall clock, so 20
  # minutes of waiting changes nothing it does. See engine/core/clock.py.
  group: state-writers
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 330  # well under the Actions per-job ceiling
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync
      - name: Nightly research (parameter search + GP alpha discovery)
        run: uv run trade research --gp
      - name: Promote (incubation/decay FSM)
        run: uv run trade promote
      - name: Shadow (forward-test the candidates the gate rejected)
        # No orders and no capital: it recomputes returns from stored bars, so it measures
        # the gate's false-negative rate for free. ~10s over ~150 tracked candidates.
        run: uv run trade shadow
      - name: Commit population + reports
        run: |
          git config user.name "trade-bot"
          git config user.email "trade-bot@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "no research changes"
          else
            git commit -m "research: nightly population update [skip ci]"
            for attempt in 1 2 3 4 5; do
              git push && break
              echo "push rejected by a concurrent write; rebasing (attempt $attempt)"
              if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
                git rebase --abort || true
                echo "::error::rebase conflict — refusing to guess, leaving the branch untouched"
                exit 1
              fi
              sleep $((RANDOM % 5 + 2))
            done
          fi

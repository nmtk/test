name: keepalive

# Job E: GitHub disables scheduled workflows after 60 days of repository inactivity.
# A weekly empty commit keeps the crons alive at zero cost.

on:
  schedule:
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Empty keepalive commit
        run: |
          git config user.name "trade-bot"
          git config user.email "trade-bot@users.noreply.github.com"
          git commit --allow-empty -m "chore: keepalive [skip ci]"
          for attempt in 1 2 3 4 5; do
            git push && break
            echo "push rejected by a concurrent write; rebasing (attempt $attempt)"
            if ! git pull --rebase origin "${GITHUB_REF_NAME}"; then
              git rebase --abort || true
              echo "::error::rebase conflict — refusing to guess, leaving the branch untouched"
              exit 1
            fi
            sleep $((RANDOM % 5 + 2))
          done
